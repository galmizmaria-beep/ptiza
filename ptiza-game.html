        const waveManager={timer:0,config:{},qIndex:0,wavePool:[],init:function(){const style=CFG.levelStyle;if(style==='sparse'){this.config={minTime:60,maxTime:100};this.wavePool=['single','double']}else if(style==='dense'){this.config={minTime:20,maxTime:40};this.wavePool=['wall','corridor','slalom','double']}else{this.config={minTime:40,maxTime:80};this.wavePool=['single','double','corridor','wall']}
        this.timer=10;this.qIndex=0;this.spawnWave('single', 2000);this.spawnWave('double', 4500);this.spawnWave(this.wavePool[Math.floor(Math.random()*this.wavePool.length)], 7000);this.setNextWaveTimer()},setNextWaveTimer:function(){this.timer=this.config.minTime+Math.random()*(this.config.maxTime-this.config.minTime)},update:function(){if(GM.pause)return;this.timer--;if(this.timer<=0){this.spawnWave(this.wavePool[Math.floor(Math.random()*this.wavePool.length)]);this.setNextWaveTimer()}},spawnWave:function(type, baseZ=8e3){const z=baseZ, y=(Math.random()-.5)*H*.7, placeCoin=this.qIndex<CFG.qs.length;const addObj=(t,x,y,z,qid=null)=>{const obj={t,x,y,z};if(qid!==null)obj.qid=qid;GM.objs.push(obj)};let coinX = CFG.coinPath === 'center' ? 0 : (Math.random()-.5)*W*.35;if(type==='single'){if(placeCoin){addObj('c',coinX,y,z,this.qIndex);this.qIndex++}else{addObj('o',(Math.random()-.5)*W*1.2,y,z)}}else if(type==='double'){const x1=(Math.random()-.5)*W*1.2;addObj('o',x1,y,z);if(placeCoin){addObj('c',coinX,y,z+500,this.qIndex);this.qIndex++}else{addObj('o',x1+(Math.random()>.5?W*.4:-W*.4),(Math.random()-.5)*H*.7,z+500)}}else if(type==='wall'){const gapIndex=Math.random()<0.6?2:(Math.random()<0.5?1:3);const gapX = (gapIndex-2)*W*.35;for(let i=0;i<5;i++){const x=(i-2)*W*.35;if(i===gapIndex){if(placeCoin){addObj('c', CFG.coinPath==='center' ? gapX : gapX+(Math.random()-.5)*W*.15, y, z, this.qIndex);this.qIndex++}}else{addObj('o',x,y,z)}}}else if(type==='corridor'){const pathX=(Math.random()-.5)*W*.25;const width=W*(.35+Math.random()*.2);for(let i=0;i<6;i++){addObj('o',pathX-width,y+i*H/5-H/2,z+i*200);addObj('o',pathX+width,y+i*H/5-H/2,z+i*200)}if(placeCoin){addObj('c', CFG.coinPath==='center' ? pathX : pathX+(Math.random()-.5)*W*.2, y, z-200, this.qIndex);this.qIndex++}}else if(type==='slalom'){const startX=(Math.random()-.5)*W*.25;for(let i=0;i<4;i++){addObj('o',startX+W*.4*(i%2===0?1:-1),y,z+i*800)}if(placeCoin){addObj('c', CFG.coinPath==='center' ? startX : startX+(Math.random()-.5)*W*.2, y, z+1200, this.qIndex);this.qIndex++}}}};
        function updateHUD(){
            document.getElementById('hud-time').style.display=GM.run||editorScene==='game'||editorScene==='tasks' ? (CFG.timerEnabled?'block':'none') : 'none';

        }
        function renderEnd(reason){
            document.getElementById('scr-end').classList.remove('hidden');
            document.getElementById('end-card').dataset.result=reason===true?'win':reason==='timeout'?'timeout':'lose';
            const title=document.getElementById('mt-end');title.innerText=reason===true?CFG.win:reason==='timeout'?CFG.timeout:CFG.lose;

        const GM={run:false,pause:false,frame:0,time:0,score:0,objs:[],mx:0,my:0,bgY:0,hurt:0,timerInt:null,

                iAvatar.src=(IMG.avatarsInFlight&&IMG.avatarsInFlight[selectedAvatarIdx])?IMG.avatarsInFlight[selectedAvatarIdx]:selectedAvatar;iCreature.src=selectedCreature;
                document.getElementById('char-select-screen').classList.add('hidden');resize();GM.score=0;GM.objs=[];GM.hurt=0;GM.frame=0;GM.bgY=0;GM.time=Math.max(1,parseInt(CFG.time)||60);GM.pause=false;GM.run=true;

        };
        document.getElementById('btn-play-game').addEventListener('click',GM.start);document.getElementById('btn-restart').addEventListener('click',GM.reset);window.addEventListener('mousemove',e=>{if(!GM.pause){GM.mx=e.clientX;GM.my=e.clientY}});window.addEventListener('touchmove',e=>{if(!GM.pause){e.preventDefault();GM.mx=e.touches[0].clientX;GM.my=e.touches[0].clientY}},{passive:false});
        function drawBg(){ctx.save();ctx.globalAlpha=1;ctx.fillStyle=CFG.c_bg;ctx.fillRect(0,0,W,H);if(iBg.src&&iBg.complete&&iBg.naturalWidth){ctx.globalAlpha=CFG.bgImageOpacity??1;let sh=(W/iBg.width)*iBg.height;let yOff=GM.bgY%sh;for(let y=yOff-sh;y<H;y+=sh){ctx.drawImage(iBg,0,Math.floor(y),W,Math.ceil(sh)+1)}}if(CFG.bgOverlayOpacity>0){ctx.globalAlpha=CFG.bgOverlayOpacity;ctx.fillStyle=CFG.bgOverlayColor||'#000000';ctx.fillRect(0,0,W,H)}ctx.restore()}
        function drawFlightObject(type,x,y,size){
            const img=type==='c'?iCoin:iObs;
            if(img.src&&img.complete&&img.naturalWidth){drawContained(img,x-size/2,y-size/2,size,size);return;}
            ctx.save();const r=size/2;
            if(type==='c'){ctx.fillStyle='#d79524';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffdc68';ctx.beginPath();ctx.arc(x,y,r*.76,0,Math.PI*2);ctx.fill();ctx.fillStyle='#bf8422';ctx.fillRect(x-r*.12,y-r*.45,r*.24,r*.9);}

        let animationFramePending=false;
        function queueFrame(){if(animationFramePending)return;animationFramePending=true;requestAnimationFrame(()=>{animationFramePending=false;if(GM.run)mainLoop();else preGameLoop();});}
        function mainLoop(){if(!GM.run)return;queueFrame();ctx.clearRect(0,0,W,H);if(GM.pause)GM.bgY+=.5;if(!GM.pause){let speed=parseInt(CFG.speed);let forwardSpeed=speed*4;GM.frame++;waveManager.update();GM.bgY+=forwardSpeed*.1;let pX=(W/2-GM.mx)*.3,pY=(H*.75-GM.my)*.3;for(let i=GM.objs.length-1;i>=0;i--){let o=GM.objs[i];o.z-=forwardSpeed;if(o.z<10){GM.objs.splice(i,1);continue}if(o.z<200&&o.z>20){let depthScale=.7+GM.my/H*.6,pSize=120*parseFloat(CFG.scale)*depthScale,scale=500/o.z,sx=W/2+(o.x+pX)*scale,sy=H/2+(o.y+pY)*scale,size=100*scale*parseFloat(CFG.objScale||1),dist=Math.hypot(sx-GM.mx,sy-GM.my),hitbox=size*.5+pSize*.4;if(dist<hitbox){let hitObject=GM.objs.splice(i,1)[0];hit(hitObject)}}}if(GM.hurt>0)GM.hurt--;if(!GM.pause&&CFG.qs.length>0&&waveManager.qIndex>=CFG.qs.length&&!GM.objs.some(o=>o.t==='c')){if(GM.score>=CFG.qs.length)GM.end(true);else GM.end('out_of_coins');return;}}
        drawBg();GM.objs.sort((a,b)=>b.z-a.z);let objScaleUser=parseFloat(CFG.objScale||1);let pX=(W/2-GM.mx)*.3,pY=(H*.75-GM.my)*.3;for(let o of GM.objs){let scale=500/o.z,sx=W/2+(o.x+pX)*scale,sy=H/2+(o.y+pY)*scale,size=100*scale*objScaleUser;drawFlightObject(o.t,sx,sy,size)}

        function preGameLoop(){if(GM.run)return;queueFrame();const previewFlying=CFG.editorPreview&&['game','tasks'].includes(editorScene);const step=previewFlying?Number(CFG.speed)*4:5;GM.bgY+=step*.1;if(previewFlying)previewTravel+=step;ctx.clearRect(0,0,W,H);drawBg();if(CFG.editorPreview && ['game','tasks'].includes(editorScene))drawEditorFlight()}
        function hit(obj){if(obj.t==='o'){sfx('boom');GM.hurt=30;let f=document.createElement('div');f.style="position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at center, rgba(255,0,0,0.5) 0%, rgba(255,0,0,0) 70%);pointer-events:none;z-index:99";document.body.appendChild(f);setTimeout(()=>f.remove(),150);if(CFG.timerEnabled){GM.time-=5;if(GM.time<=0)GM.end('timeout')}}else if(obj.t==='c'){sfx('coin');if(CFG.qs.length>0&&obj.qid!==undefined){GM.pause=true;quiz(obj.qid)}}document.getElementById('ui-time').innerText=GM.time;document.getElementById('ui-score').innerText=GM.score}
        function shuffled(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
        function quiz(q_idx){
            const q=CFG.qs[q_idx] || (CFG.editorPreview?{t:LANG.sample_question,type:'choice',c:LANG.sample_answer,w:['3','5']}:null);if(!q){GM.pause=false;return}
